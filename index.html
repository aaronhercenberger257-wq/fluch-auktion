<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fluch-Auktion – 20 € Draft</title>
  <meta name="description" content="Das 20-€-Draft-Spiel für zwei Spieler online: Biete auf zufällige Jujutsu-Kaisen-Fähigkeiten und bau das stärkste Team.">
  <meta name="theme-color" content="#07060b">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%23b91c1c'/%3E%3Ctext x='50' y='72' text-anchor='middle' font-size='64' fill='white' font-family='serif'%3E%E5%91%AA%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@700;900&text=%E5%91%AA%E7%84%A1%E4%BC%8F%E5%BD%B1%E9%AD%82%E7%82%8E%E5%88%A4%E8%B3%AD%E9%99%90%E8%99%9A%E7%9C%BC%E6%96%AC%E9%96%8B%E5%8D%81%E9%AD%94%E5%A4%89%E6%93%8D%E9%87%98%E6%AF%94%E8%A1%80%E8%A8%80%E6%9B%BF%E7%81%AB%E6%A7%8B%E7%99%92%E9%96%83%E6%8B%B3%E7%B8%9B%E4%BD%93%E7%B0%A1%E5%88%80%E6%84%9B%E6%B5%B7%E6%9C%88%E8%92%BC%E8%B5%AB%E5%86%99%E9%87%8C%E6%8A%95%E6%BD%AE%E8%8A%B1%E9%9B%B7%E6%B0%B7%E6%AD%A6%E5%BC%B7%E7%B1%A0%E7%86%8A%E8%B1%AA%E8%AA%93%E8%94%B5%E5%A4%A9%E9%9B%B2%E8%A3%82%E9%8E%96%E7%8D%84%E6%A7%8C%E9%8A%83%E9%9E%98%E6%8C%87%E7%A5%9E%E7%AB%9C%E5%88%91%E5%88%83%E7%B8%84%E5%B8%AF%E7%92%B0&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-energy" aria-hidden="true"></div>

  <main id="app">
    <!-- Startseite -->
    <section id="screen-start" class="screen active">
      <div class="hero">
        <div class="hero-seal">呪</div>
        <h1>Fluch-Auktion</h1>
        <p class="hero-sub">Das 20-€-Draft · 2 Spieler online</p>
      </div>

      <div class="panel">
        <label class="field">
          <span>Dein Name</span>
          <input id="in-name" maxlength="16" placeholder="z. B. Aaron" autocomplete="nickname">
        </label>

        <button id="btn-create" class="btn btn-primary btn-big">Raum erstellen</button>

        <div class="divider"><span>oder</span></div>

        <div class="join-row">
          <input id="in-code" maxlength="5" placeholder="CODE" autocapitalize="characters" autocomplete="off" spellcheck="false">
          <button id="btn-join" class="btn btn-secondary">Beitreten</button>
        </div>
        <p id="start-error" class="error" role="alert"></p>
      </div>

      <button id="btn-rules" class="btn-link">So funktioniert's</button>
    </section>

    <!-- Lobby -->
    <section id="screen-lobby" class="screen">
      <div class="panel">
        <p class="eyebrow">Raum-Code</p>
        <div class="room-code" id="lobby-code">-----</div>
        <button id="btn-share" class="btn btn-secondary">Einladungslink kopieren</button>

        <div class="lobby-players" id="lobby-players"></div>

        <div class="settings" id="lobby-settings">
          <p class="eyebrow">Spielmodus</p>
          <label class="setting">
            <span>Modus</span>
            <select id="set-mode"></select>
          </label>
          <p id="mode-desc" class="hint left mode-desc"></p>
          <label class="setting">
            <span>Anime</span>
            <select id="set-pack"></select>
          </label>
          <label class="setting">
            <span>Was wird versteigert?</span>
            <select id="set-kind">
              <option value="abilities">Fähigkeiten</option>
              <option disabled>Charaktere (bald)</option>
            </select>
          </label>
        </div>

        <button id="btn-start" class="btn btn-primary btn-big" disabled>Warte auf Mitspieler …</button>
        <p id="lobby-wait" class="muted center"></p>
        <p id="lobby-error" class="error" role="alert"></p>
      </div>
      <button class="btn-link" data-action="home">Verlassen</button>
    </section>

    <!-- Spiel -->
    <section id="screen-game" class="screen">
      <div id="game"></div>
    </section>
  </main>

  <!-- Fähigkeit-Detail / Anleitung -->
  <div id="modal" class="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true">
      <button class="modal-close" aria-label="Schließen">×</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.10.1/mqtt.min.js"></script>
  <script src="js/packs/jjk.js"></script>
  <script src="js/art.js"></script>
  <script src="js/game.js"></script>
  <script src="js/net.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
